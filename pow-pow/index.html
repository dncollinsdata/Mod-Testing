<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081321">
<title>POW POW V4</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#081321;color:white;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;color:white;border:0;-webkit-appearance:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:#081321}
#hud{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:7px;padding:max(7px,env(safe-area-inset-top)) 8px 6px;background:#071423;z-index:10}
.panel{background:#102842;border:1px solid #ffffff2f;border-radius:13px;padding:6px 8px}.panel.right{text-align:right}
.label{font-weight:950;font-size:10px;margin-bottom:4px}.bar{height:11px;background:#24364d;border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;transition:width .1s linear}
#hp{background:linear-gradient(90deg,#ff715f,#ff324d)}#stam{background:linear-gradient(90deg,#ffe45e,#ff9e2a)}#prog{background:linear-gradient(90deg,#5ef0a6,#29c86d)}
#center{text-align:center;font-weight:1000;font-size:10px;line-height:1.25}#waveLabel{color:#ffd86b;margin-top:3px}
#world{position:relative;flex:1;min-height:0;overflow:hidden;background:linear-gradient(#69caff 0 42%,#71c66f 42% 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#status{position:absolute;z-index:5;top:8px;left:50%;transform:translateX(-50%);background:#071423df;border:1px solid #ffffff35;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:900;white-space:nowrap}
#count{position:absolute;inset:0;z-index:7;display:grid;place-items:center;font-size:clamp(78px,25vw,170px);font-weight:1000;text-shadow:0 8px 30px #000;pointer-events:none}#count.hide{display:none}
#waveFlash{position:absolute;z-index:6;top:18%;left:50%;transform:translateX(-50%);font-size:clamp(24px,8vw,48px);font-weight:1000;text-shadow:0 5px 18px #000;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}#waveFlash.on{opacity:1}
#overlay{position:absolute;inset:0;z-index:8;display:none;place-items:center;background:#04101ddd;text-align:center;padding:20px}#overlay.on{display:grid}
#big{font-size:42px;font-weight:1000;line-height:1}#small{margin-top:10px;font-size:13px;font-weight:800;max-width:330px}
#again{margin-top:18px;background:white;color:#102033;padding:13px 22px;border-radius:999px;font-weight:1000}
#controls{flex:0 0 auto;display:grid;grid-template-columns:1fr 138px;gap:8px;padding:8px max(9px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));background:#071423}
#move{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}#actions{display:grid;grid-template-columns:1fr;gap:7px}
.btn{min-height:54px;border-radius:15px;border:2px solid #ffffff65;background:#27415f;font-size:13px;font-weight:1000;touch-action:none;box-shadow:0 5px 12px #0004}
.btn:active,.btn.on{transform:scale(.95);filter:brightness(1.25)}#left,#right{font-size:26px}#jump{background:#285fbe}#sprint{background:#d88416}
@media(orientation:landscape){#controls{grid-template-columns:1fr 170px}.btn{min-height:42px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="panel">
      <div class="label">❤️ HEALTH</div>
      <div class="bar"><div id="hp" class="fill"></div></div>
      <div class="bar" style="height:6px;margin-top:5px"><div id="stam" class="fill"></div></div>
    </div>
    <div id="center">💥 POW POW V4<br><span id="levelLabel">LEVEL 1</span><div id="waveLabel">WAVE 1</div></div>
    <div class="panel right">
      <div class="label">🏁 ESCAPE</div>
      <div class="bar"><div id="prog" class="fill" style="width:0%"></div></div>
      <div id="meters" style="font-size:9px;margin-top:5px;font-weight:900">0 / 1000 m</div>
    </div>
  </div>

  <div id="world">
    <canvas id="c"></canvas>
    <div id="status">LEVEL 1 STARTS IN 3...</div>
    <div id="count">3</div>
    <div id="waveFlash">🧟 1 ZOMBIE!</div>
    <div id="overlay">
      <div>
        <div id="big"></div>
        <div id="small"></div>
        <button id="again">NEXT LEVEL</button>
      </div>
    </div>
  </div>

  <div id="controls">
    <div id="move">
      <button id="left" class="btn" type="button">◀</button>
      <button id="jump" class="btn" type="button">⬆ JUMP</button>
      <button id="right" class="btn" type="button">▶</button>
    </div>
    <div id="actions"><button id="sprint" class="btn" type="button">⚡ SUPER SPRINT</button></div>
  </div>
</div>

<script>
(()=>{"use strict";
const $=id=>document.getElementById(id),canvas=$("c"),ctx=canvas.getContext("2d");
const ui={hp:$("hp"),stam:$("stam"),prog:$("prog"),meters:$("meters"),status:$("status"),count:$("count"),waveFlash:$("waveFlash"),overlay:$("overlay"),big:$("big"),small:$("small"),again:$("again"),level:$("levelLabel"),wave:$("waveLabel")};
const btnL=$("left"),btnR=$("right"),btnJ=$("jump"),btnS=$("sprint");
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.max(1,Math.floor(W*dpr));canvas.height=Math.max(1,Math.floor(H*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize,{passive:true});resize();

const G={level:1,wave:1,running:false,won:false,token:0,hp:100,stamina:100,dist:0,goal:1000,x:0,vx:0,jump:0,jumpV:0,left:false,right:false,sprint:false,inv:0,shake:0,last:performance.now(),nextWave:1.2,nextSkel:.8,arrows:[],skeletons:[],zombies:[]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const laneX=v=>W/2+v*(W*.32),roadY=d=>H*.20+clamp(d,0,1.1)*H*.74,roadHalf=d=>W*(.07+.35*clamp(d,0,1));

function levelGoal(){return 800+G.level*200}
function updateHud(){G.goal=levelGoal();ui.hp.style.width=G.hp+"%";ui.stam.style.width=G.stamina+"%";ui.prog.style.width=clamp(G.dist/G.goal*100,0,100)+"%";ui.meters.textContent=Math.floor(G.dist)+" / "+G.goal+" m";ui.level.textContent="LEVEL "+G.level;ui.wave.textContent="WAVE "+G.wave}
function spawnSkeleton(){const side=Math.random()<.5?-1:1;G.skeletons.push({x:side*rnd(.62,.93),depth:rnd(.015,.06),cool:rnd(.13,.35)})}
function spawnZombie(){const lv=G.level;G.zombies.push({x:rnd(-.72,.72),depth:rnd(.84,1.03),speed:rnd(.14+.012*lv,.20+.016*lv),phase:rnd(0,6.28)})}
function shoot(s){const fireBoost=Math.min(.25,(G.level-1)*.025);G.arrows.push({x:s.x,y:s.depth,vx:(G.x-s.x)*(.70+fireBoost),vy:(.88-s.depth)*(.92+fireBoost),life:4,ang:0})}
function flashWave(n){ui.waveFlash.textContent="🧟 "+n+" ZOMBIE"+(n===1?"!":"S!");ui.waveFlash.classList.add("on");setTimeout(()=>ui.waveFlash.classList.remove("on"),900)}
function spawnWave(){const n=Math.min(9,G.wave);flashWave(n);for(let i=0;i<n;i++)setTimeout(()=>{if(G.running)spawnZombie()},i*170);if(G.wave%2===0||G.level>=3)spawnSkeleton();G.wave++;updateHud()}
function countdown(){const t=++G.token;G.running=false;ui.count.classList.remove("hide");ui.count.textContent="3";ui.status.textContent="LEVEL "+G.level+" STARTS IN 3...";setTimeout(()=>{if(t!==G.token)return;ui.count.textContent="2";ui.status.textContent="LEVEL "+G.level+" STARTS IN 2..."},650);setTimeout(()=>{if(t!==G.token)return;ui.count.textContent="1";ui.status.textContent="LEVEL "+G.level+" STARTS IN 1..."},1300);setTimeout(()=>{if(t!==G.token)return;ui.count.textContent="RUN!";ui.status.textContent="RUN! LEVEL "+G.level+"!";G.running=true;G.wave=1;G.nextWave=.35;for(let i=0;i<Math.min(1+Math.floor(G.level/3),3);i++)spawnSkeleton();updateHud()},1950);setTimeout(()=>{if(t!==G.token)return;ui.count.classList.add("hide")},2500)}
function startLevel(){Object.assign(G,{running:false,won:false,hp:100,stamina:100,dist:0,x:0,vx:0,jump:0,jumpV:0,left:false,right:false,sprint:false,inv:0,shake:0,last:performance.now(),wave:1,nextWave:.7,nextSkel:.9,arrows:[],skeletons:[],zombies:[]});ui.overlay.classList.remove("on");updateHud();countdown()}
function finishLevel(){G.running=false;G.won=true;++G.token;ui.count.classList.add("hide");ui.big.textContent="🏆 LEVEL "+G.level+" COMPLETE!";ui.small.textContent="Next level gets harder: faster zombies, bigger waves, more skeletons, and faster arrows.";ui.again.textContent="START LEVEL "+(G.level+1);ui.overlay.classList.add("on")}
function lose(){G.running=false;G.won=false;++G.token;ui.count.classList.add("hide");ui.big.textContent="💀 CAUGHT!";ui.small.textContent="You reached "+Math.floor(G.dist)+" m on Level "+G.level+". Try this level again.";ui.again.textContent="TRY LEVEL "+G.level+" AGAIN";ui.overlay.classList.add("on")}
ui.again.addEventListener("click",()=>{if(G.won)G.level++;startLevel()});
function hit(dmg){if(G.inv>0||!G.running)return;G.hp=clamp(G.hp-dmg,0,100);G.inv=.6;G.shake=.24;ui.status.textContent="OUCH! KEEP RUNNING!";updateHud();if(G.hp<=0)lose()}
function jump(){if(G.running&&G.jump<=.001){G.jumpV=6.3;ui.status.textContent="JUMP!"}}
function bindHold(btn,on,off){const start=e=>{e.preventDefault();on();btn.classList.add("on")},stop=e=>{if(e)e.preventDefault();off();btn.classList.remove("on")};btn.addEventListener("pointerdown",start);btn.addEventListener("pointerup",stop);btn.addEventListener("pointercancel",stop);btn.addEventListener("pointerleave",e=>{if(e.buttons)stop(e)})}
bindHold(btnL,()=>G.left=true,()=>G.left=false);bindHold(btnR,()=>G.right=true,()=>G.right=false);bindHold(btnS,()=>G.sprint=true,()=>G.sprint=false);btnJ.addEventListener("pointerdown",e=>{e.preventDefault();jump()});

function update(dt){
  if(G.inv>0)G.inv-=dt;if(G.shake>0)G.shake-=dt;if(!G.running)return;
  const dir=(G.right?1:0)-(G.left?1:0);G.vx+=dir*(9.2+.18*G.level)*dt;G.vx*=Math.pow(.0008,dt);G.x=clamp(G.x+G.vx*dt,-.84,.84);
  let speed=110+Math.min(40,(G.level-1)*4);if(G.sprint&&G.stamina>1){speed=190+Math.min(55,(G.level-1)*5);G.stamina=clamp(G.stamina-28*dt,0,100)}else G.stamina=clamp(G.stamina+23*dt,0,100);
  G.dist+=speed*dt;if(G.dist>=G.goal){G.dist=G.goal;updateHud();finishLevel();return}
  if(G.jump>0||G.jumpV!==0){G.jumpV-=13.2*dt;G.jump+=G.jumpV*dt;if(G.jump<0){G.jump=0;G.jumpV=0}}
  G.nextWave-=dt;if(G.nextWave<=0){spawnWave();G.nextWave=Math.max(1.15,2.65-G.level*.06)}
  G.nextSkel-=dt;if(G.nextSkel<=0){spawnSkeleton();G.nextSkel=Math.max(.7,1.5-G.level*.07)}
  for(const s of G.skeletons){s.depth+=.027*dt;s.cool-=dt;if(s.cool<=0){shoot(s);s.cool=Math.max(.4,rnd(.72,.98)-G.level*.025)}}G.skeletons=G.skeletons.filter(s=>s.depth<1.06);
  for(const a of G.arrows){a.x+=a.vx*dt;a.y+=a.vy*dt;a.life-=dt;a.ang=Math.atan2(a.vy,a.vx);if(a.y>.76&&a.y<1.02&&Math.abs(a.x-G.x)<.105&&G.jump<.36){a.life=0;hit(14+Math.min(8,G.level))}}G.arrows=G.arrows.filter(a=>a.life>0&&a.y<1.14);
  for(const z of G.zombies){z.phase+=dt*8;z.depth-=z.speed*dt*(G.sprint?1.22:.92);z.x+=(G.x-z.x)*(0.52+Math.min(.18,G.level*.015))*dt;if(z.depth<.89&&Math.abs(z.x-G.x)<.15&&G.jump<.30){z.depth=.99;hit(14+Math.min(10,G.level*2))}}G.zombies=G.zombies.filter(z=>z.depth>.18&&z.depth<1.15);
  updateHud();
}

function drawSkeleton(x,y,s){ctx.save();ctx.translate(x,y);ctx.strokeStyle="#f4f0df";ctx.lineWidth=4*s;ctx.lineCap="round";ctx.beginPath();ctx.arc(0,-37*s,15*s,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-22*s);ctx.lineTo(0,16*s);ctx.moveTo(0,-10*s);ctx.lineTo(-20*s,6*s);ctx.moveTo(0,-10*s);ctx.lineTo(20*s,6*s);ctx.moveTo(0,16*s);ctx.lineTo(-14*s,40*s);ctx.moveTo(0,16*s);ctx.lineTo(14*s,40*s);ctx.stroke();ctx.strokeStyle="#69431f";ctx.lineWidth=3*s;ctx.beginPath();ctx.arc(22*s,-5*s,13*s,-1.2,1.2);ctx.stroke();ctx.restore()}
function drawZombie(z,x,y,s){ctx.save();ctx.translate(x,y+Math.sin(z.phase)*4*s);ctx.fillStyle="#4e9b4b";ctx.fillRect(-17*s,-58*s,34*s,34*s);ctx.fillStyle="#33445a";ctx.fillRect(-20*s,-25*s,40*s,43*s);ctx.fillStyle="#26344a";ctx.fillRect(-17*s,18*s,13*s,30*s);ctx.fillRect(4*s,18*s,13*s,30*s);ctx.fillStyle="white";ctx.fillRect(-9*s,-46*s,5*s,5*s);ctx.fillRect(5*s,-46*s,5*s,5*s);ctx.restore()}
function draw(){
  ctx.clearRect(0,0,W,H);const sh=G.shake>0?rnd(-5,5):0;ctx.save();ctx.translate(sh,sh*.4);
  const sky=ctx.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,"#61c5ff");sky.addColorStop(1,"#c9edff");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.5);
  ctx.fillStyle="#4f8d73";ctx.beginPath();ctx.moveTo(0,H*.42);for(let i=0;i<=8;i++)ctx.lineTo(i*W/8,H*.34-(i%2)*H*.08);ctx.lineTo(W,H*.5);ctx.lineTo(0,H*.5);ctx.fill();ctx.fillStyle="#72c66d";ctx.fillRect(0,H*.42,W,H*.58);
  ctx.beginPath();ctx.moveTo(W*.42,H*.20);ctx.lineTo(W*.58,H*.20);ctx.lineTo(W*.89,H*.98);ctx.lineTo(W*.11,H*.98);ctx.closePath();ctx.fillStyle="#d2c7ad";ctx.fill();
  ctx.strokeStyle="#fff5";ctx.lineWidth=2;for(let i=0;i<9;i++){const y=H*.23+i*H*.09,t=(y-H*.20)/(H*.78),hw=roadHalf(t);ctx.beginPath();ctx.moveTo(W/2-hw,y);ctx.lineTo(W/2+hw,y);ctx.stroke()}
  if(G.dist>G.goal*.76){const clos=Math.min(1,(G.dist-G.goal*.76)/(G.goal*.24)),y=H*(.23+.33*clos),w=W*(.12+.27*clos),h=45+110*clos;ctx.fillStyle="#25c86b";ctx.fillRect(W/2-w/2,y-h,w,h);ctx.fillStyle="white";ctx.textAlign="center";ctx.font=`900 ${14+18*clos}px system-ui`;ctx.fillText("LEVEL "+G.level+" ESCAPE",W/2,y-h/2)}
  const things=[];G.skeletons.forEach(o=>things.push({k:"s",d:o.depth,o}));G.zombies.forEach(o=>things.push({k:"z",d:o.depth,o}));G.arrows.forEach(o=>things.push({k:"a",d:o.y,o}));things.sort((a,b)=>a.d-b.d);
  for(const t of things){const d=clamp(t.d,.02,1.08),y=roadY(d),s=.25+d*1.02,x=laneX(t.o.x);if(t.k==="s")drawSkeleton(x,y,s);else if(t.k==="z")drawZombie(t.o,x,y,s);else{ctx.save();ctx.translate(x,y);ctx.rotate(t.o.ang);ctx.strokeStyle="#5c3b20";ctx.lineWidth=3*s;ctx.beginPath();ctx.moveTo(-16*s,0);ctx.lineTo(16*s,0);ctx.stroke();ctx.fillStyle="#bbb";ctx.beginPath();ctx.moveTo(16*s,0);ctx.lineTo(8*s,-5*s);ctx.lineTo(8*s,5*s);ctx.closePath();ctx.fill();ctx.restore()}}
  const px=laneX(G.x),py=H*.84-G.jump*42,flicker=G.inv>0&&Math.floor(G.inv*12)%2===0;if(!flicker){ctx.save();ctx.translate(px,py);ctx.fillStyle="#e9364f";ctx.fillRect(-20,-66,40,48);ctx.fillStyle="#9c1830";ctx.fillRect(-17,-18,14,42);ctx.fillRect(3,-18,14,42);ctx.fillStyle="#ef334e";ctx.beginPath();ctx.arc(0,-84,17,0,Math.PI*2);ctx.fill();ctx.fillStyle="#17243a";ctx.fillRect(-16,-100,32,11);ctx.fillStyle="white";ctx.fillRect(-9,-87,5,5);ctx.fillRect(5,-87,5,5);ctx.restore()}
  if(G.skeletons.length){ctx.fillStyle="#ffcc3d";ctx.font="1000 14px system-ui";ctx.textAlign="center";ctx.fillText("🏹 LONG-RANGE SKELETONS!",W/2,H*.11)}
  if(G.zombies.some(z=>z.depth>.78)){ctx.fillStyle="#ff334d";ctx.font="1000 17px system-ui";ctx.textAlign="center";ctx.fillText("⚠ ZOMBIE WAVE CLOSE!",W/2,H*.16)}
  ctx.restore();
}
function loop(now){const dt=Math.min(.033,(now-G.last)/1000||0);G.last=now;update(dt);draw();requestAnimationFrame(loop)}
updateHud();startLevel();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
