<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Arena Mobile V5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#73cfff;color:#fff;user-select:none;-webkit-user-select:none}button{font:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#69caff 0 58%,#68c982 58%)}
#hud{padding:max(10px,env(safe-area-inset-top)) 12px 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(7,18,34,.86)}.name{font-weight:950;font-size:12px;margin-bottom:5px}.right{text-align:right}.bar{height:16px;border-radius:99px;background:#24354d;overflow:hidden}.fill{height:100%;width:100%;transition:width .16s}#rhp{background:#ef334e}#bhp{background:#2580ff}.energy{height:7px;margin-top:5px}#ren{background:#ffc23c}#ben{background:#65efff}
#world{position:relative;overflow:hidden;min-height:0;background:radial-gradient(circle at 50% 15%,rgba(255,255,255,.9),transparent 20%),linear-gradient(transparent 0 48%,rgba(55,101,113,.24) 48% 49%,transparent 49%)}#arena{position:absolute;left:5%;right:5%;bottom:8%;height:47%;border-radius:50%;background:#e8eef1;border:7px solid #435d70;transform:perspective(700px) rotateX(58deg);box-shadow:0 25px 35px #0003}
#status{position:absolute;z-index:8;left:50%;top:12px;transform:translateX(-50%);background:#071a2fd9;padding:8px 13px;border-radius:99px;font-size:12px;font-weight:900;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.fighter{position:absolute;z-index:5;bottom:13%;width:92px;height:190px;transition:left .18s ease}.red{left:23%}.blue{left:64%}.shadow{position:absolute;bottom:0;left:8px;width:76px;height:18px;border-radius:50%;background:#0004}.head{position:absolute;top:0;left:27px;width:39px;height:45px;border-radius:47%;box-shadow:inset -6px -4px #0002}.hair{position:absolute;z-index:2;top:-2px;left:26px;width:41px;height:16px;border-radius:50% 50% 22% 22%;background:#18243a}.eye{position:absolute;z-index:3;top:20px;width:5px;height:5px;border-radius:50%;background:white}.e1{left:37px}.e2{left:54px}.body{position:absolute;top:43px;left:20px;width:54px;height:69px;border-radius:16px}.arm{position:absolute;top:50px;width:18px;height:66px;border-radius:12px;transform-origin:50% 8%}.al{left:7px;transform:rotate(7deg)}.ar{right:7px;transform:rotate(-7deg)}.leg{position:absolute;top:108px;width:21px;height:72px;border-radius:12px;transform-origin:50% 5%}.ll{left:22px}.lr{right:22px}.red .head,.red .body,.red .arm{background:#ef334e}.red .leg{background:#9f1630}.blue .head,.blue .body,.blue .arm{background:#2580ff}.blue .leg{background:#0d3c9e}
.punch .ar{animation:punchR .28s}.blue.punch .al{animation:punchL .28s}.kick .lr{animation:kickR .38s}.blue.kick .ll{animation:kickL .38s}.jump{animation:jump .5s}.dash.red{animation:dashR .34s}.dash.blue{animation:dashL .34s}.block .al{transform:rotate(-55deg) translate(11px,-8px)}.block .ar{transform:rotate(55deg) translate(-11px,-8px)}.hurt{filter:brightness(1.8)}.ko{transform:rotate(72deg) translateY(25px)}
@keyframes punchR{50%{transform:rotate(-82deg) translateY(-20px)}}@keyframes punchL{50%{transform:rotate(82deg) translateY(-20px)}}@keyframes kickR{50%{transform:rotate(-62deg) translateY(-15px)}}@keyframes kickL{50%{transform:rotate(62deg) translateY(-15px)}}@keyframes jump{50%{transform:translateY(-65px)}}@keyframes dashR{45%{transform:translateX(75px)}}@keyframes dashL{45%{transform:translateX(-75px)}}
#controls{z-index:20;background:#0b1c32;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:145px 1fr;gap:12px;pointer-events:auto}.moveBox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{min-height:54px;border:2px solid #ffffff88;border-radius:16px;color:white;font-weight:950;font-size:12px;box-shadow:0 5px 12px #0004;touch-action:manipulation;pointer-events:auto}.btn:active{transform:scale(.94);filter:brightness(1.25)}.dir{background:#243b59;font-size:23px}.p{background:#d5223e}.k{background:#df5e33}.d{background:#7d37cf}.pow{background:#e99510}.bl{background:#2474bb}.j{background:#169b6f}
#win{display:none;position:absolute;z-index:30;left:50%;top:42%;transform:translate(-50%,-50%);font-size:44px;font-weight:1000;text-shadow:0 5px 18px #0007;text-align:center;width:90%}#again{display:none;position:absolute;z-index:31;left:50%;top:56%;transform:translateX(-50%);border:0;border-radius:99px;padding:13px 22px;background:white;color:#102039;font-weight:1000}
@media(max-width:520px){#controls{grid-template-columns:120px 1fr;gap:8px;padding-top:8px}.btn{min-height:49px;font-size:10px}.moveBox,.moves{gap:6px}.fighter{transform:scale(.86);transform-origin:bottom center}.red{left:17%}.blue{left:61%}}
</style>
</head>
<body>
<div id="app">
<div id="hud"><div><div class="name">🔴 YOU · RED</div><div class="bar"><div class="fill" id="rhp"></div></div><div class="bar energy"><div class="fill" id="ren"></div></div></div><div class="right"><div class="name">🔵 CHATGPT AI · BLUE</div><div class="bar"><div class="fill" id="bhp"></div></div><div class="bar energy"><div class="fill" id="ben"></div></div></div></div>
<div id="world"><div id="arena"></div><div id="status">V5 READY · Tap PUNCH</div>
<div id="red" class="fighter red"><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="body"></div><div class="arm al"></div><div class="arm ar"></div><div class="leg ll"></div><div class="leg lr"></div></div>
<div id="blue" class="fighter blue"><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="eye e1"></div><div class="eye e2"></div><div class="body"></div><div class="arm al"></div><div class="arm ar"></div><div class="leg ll"></div><div class="leg lr"></div></div>
<div id="win"></div><button id="again" onclick="resetGame()">FIGHT AGAIN</button></div>
<div id="controls"><div class="moveBox"><button class="btn dir" onclick="moveRed(-7)">◀</button><button class="btn dir" onclick="moveRed(7)">▶</button><button class="btn dir" onclick="moveRed(-12)">⏪</button><button class="btn dir" onclick="moveRed(12)">⏩</button></div><div class="moves"><button class="btn p" onclick="punch()">👊 PUNCH</button><button class="btn k" onclick="kick()">🦵 KICK</button><button class="btn d" onclick="dash()">💨 DASH</button><button class="btn pow" onclick="power()">⚡ POWER</button><button class="btn bl" onclick="block()">🛡 BLOCK</button><button class="btn j" onclick="jump()">⬆ JUMP</button></div></div>
</div>
<script>
let R=100,B=100,RE=100,BE=100,rx=23,bx=64,over=false,rblock=false,bbusy=false,rbusy=false;const red=document.getElementById('red'),blue=document.getElementById('blue'),statusEl=document.getElementById('status');
function hud(){rhp.style.width=R+'%';bhp.style.width=B+'%';ren.style.width=RE+'%';ben.style.width=BE+'%';red.style.left=rx+'%';blue.style.left=bx+'%'}function say(t){statusEl.textContent=t}function anim(el,c,t){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(()=>el.classList.remove(c),t)}function flash(el){el.classList.add('hurt');setTimeout(()=>el.classList.remove('hurt'),120)}function dist(){return bx-rx}function hitBlue(n){if(over)return;B=Math.max(0,B-n);flash(blue);hud();if(B===0)finish(true)}function hitRed(n){if(over)return;R=Math.max(0,R-(rblock?Math.ceil(n*.3):n));flash(red);hud();if(R===0)finish(false)}
function moveRed(n){if(over)return;rx=Math.max(2,Math.min(bx-10,rx+n));say(n>0?'RED moves toward BLUE!':'RED moves back!');hud()}
function punch(){if(over||rbusy)return;rbusy=true;anim(red,'punch',300);say('RED PUNCH!');setTimeout(()=>{if(dist()<52)hitBlue(10);else say('Move closer!')},120);setTimeout(()=>rbusy=false,320)}
function kick(){if(over||rbusy)return;rbusy=true;anim(red,'kick',400);say('RED KICK!');setTimeout(()=>{if(dist()<54)hitBlue(15);else say('Move closer!')},170);setTimeout(()=>rbusy=false,420)}
function dash(){if(over||rbusy||RE<18)return;rbusy=true;RE-=18;anim(red,'dash',360);say('RED DASH!');setTimeout(()=>{rx=Math.min(bx-10,rx+14);hitBlue(17);hud()},150);setTimeout(()=>rbusy=false,380)}
function power(){if(over||rbusy||RE<25)return;rbusy=true;RE-=25;say('RED POWER BLAST!');hud();setTimeout(()=>{hitBlue(20);rbusy=false},220)}
function block(){if(over)return;rblock=true;red.classList.add('block');say('RED BLOCK!');setTimeout(()=>{rblock=false;red.classList.remove('block')},800)}function jump(){if(over||rbusy)return;rbusy=true;anim(red,'jump',520);say('RED JUMP!');setTimeout(()=>rbusy=false,540)}
function ai(){if(over||bbusy)return;bbusy=true;const q=Math.random();if(dist()>38){bx=Math.max(rx+11,bx-7);say('BLUE moves closer');hud();setTimeout(()=>bbusy=false,330);return}if(q<.58){anim(blue,'punch',300);say('BLUE PUNCH!');setTimeout(()=>hitRed(8),120)}else if(q<.88){anim(blue,'kick',400);say('BLUE KICK!');setTimeout(()=>hitRed(12),170)}else{anim(blue,'dash',350);say('BLUE DASH!');bx=Math.max(rx+10,bx-8);hud();setTimeout(()=>hitRed(15),150)}setTimeout(()=>bbusy=false,440)}
function finish(redWon){over=true;(redWon?blue:red).classList.add('ko');win.innerHTML=redWon?'RED WINS!<br><small>You beat ChatGPT AI!</small>':'BLUE WINS!<br><small>Rematch?</small>';win.style.display='block';again.style.display='block'}function resetGame(){R=B=RE=BE=100;rx=23;bx=64;over=rblock=bbusy=rbusy=false;red.className='fighter red';blue.className='fighter blue';win.style.display='none';again.style.display='none';say('V5 READY · Tap PUNCH');hud()}
setInterval(()=>{if(!over)ai();RE=Math.min(100,RE+4);BE=Math.min(100,BE+4);hud()},1150);hud();
</script>
</body></html>
