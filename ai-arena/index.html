<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>AI Arena 3D V4</title>
<style>
:root{--red:#ef334e;--red2:#9f1630;--blue:#2580ff;--blue2:#0d3c9e;--glass:rgba(8,18,34,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#87d8ff;color:white;touch-action:manipulation}
button{font:inherit}
#game{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 20%,rgba(255,255,255,.92),rgba(255,255,255,0) 20%),linear-gradient(#69c9ff 0 53%,#6ad18f 53% 100%)}
#mountains{position:absolute;left:-10%;right:-10%;top:35%;height:23%;background:#4787a8;clip-path:polygon(0 100%,0 65%,8% 20%,15% 68%,25% 5%,34% 70%,46% 16%,56% 72%,67% 4%,77% 66%,88% 22%,100% 63%,100% 100%);opacity:.45}
#arena{position:absolute;left:50%;top:55%;width:min(92vw,820px);height:min(38vw,310px);transform:translate(-50%,-50%) perspective(900px) rotateX(60deg);border-radius:50%;background:repeating-linear-gradient(0deg,rgba(34,61,79,.12) 0 2px,transparent 2px 38px),repeating-linear-gradient(90deg,rgba(34,61,79,.12) 0 2px,transparent 2px 38px),#e9f0f3;border:8px solid #3b576b;box-shadow:0 35px 55px rgba(0,0,0,.23),inset 0 0 45px rgba(55,90,110,.12)}
#hud{position:absolute;z-index:20;left:0;right:0;top:0;padding:max(9px,env(safe-area-inset-top)) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none}
.hudBox{background:var(--glass);border:2px solid rgba(255,255,255,.2);border-radius:17px;padding:9px 10px;backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.2)}
.hudBox.ai{text-align:right}.hudName{font-size:12px;font-weight:950;letter-spacing:.04em;margin-bottom:6px}
.bar{height:15px;background:rgba(255,255,255,.14);border-radius:999px;overflow:hidden;border:1px solid rgba(255,255,255,.14)}.fill{height:100%;width:100%;transition:width .14s linear}
#redHp{background:linear-gradient(90deg,#ff8b72,var(--red))}#blueHp{background:linear-gradient(90deg,#70d7ff,var(--blue))}.energy{height:7px;margin-top:5px}#redEn{background:#ffc438}#blueEn{background:#65f0ff}
#round{background:var(--glass);border:2px solid rgba(255,255,255,.2);border-radius:999px;padding:8px 12px;font-size:11px;font-weight:950;white-space:nowrap}
#status{position:absolute;z-index:22;top:88px;left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(7,18,34,.75);border:2px solid rgba(255,255,255,.22);font-size:13px;font-weight:900;text-align:center;max-width:86vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#stage{position:absolute;z-index:10;left:50%;top:53%;width:min(94vw,850px);height:min(54vw,410px);transform:translate(-50%,-50%)}
.fighter{position:absolute;width:115px;height:235px;bottom:30px;transform-origin:50% 90%;transition:left .18s ease,filter .12s ease}#red{left:17%}#blue{left:68%}
.shadow{position:absolute;left:14px;bottom:0;width:88px;height:24px;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(2px)}.person{position:absolute;left:0;top:0;width:115px;height:218px}
.head{position:absolute;left:35px;top:0;width:46px;height:53px;border-radius:48% 48% 45% 45%;box-shadow:inset -7px -5px 0 rgba(0,0,0,.13),0 2px 0 rgba(255,255,255,.1)}
.hair{position:absolute;left:34px;top:-2px;width:48px;height:20px;border-radius:50% 50% 25% 25%;background:#17243a;z-index:2}
.eye{position:absolute;top:23px;width:6px;height:6px;border-radius:50%;background:white;z-index:3}.eye.e1{left:46px}.eye.e2{left:65px}.pupil{position:absolute;top:25px;width:3px;height:3px;border-radius:50%;background:#0a1830;z-index:4}.pupil.p1{left:48px}.pupil.p2{left:67px}
.body{position:absolute;left:27px;top:51px;width:62px;height:80px;border-radius:18px 18px 14px 14px;box-shadow:inset -9px 0 0 rgba(0,0,0,.11)}
.arm{position:absolute;top:59px;width:22px;height:78px;border-radius:14px;transform-origin:50% 10%;box-shadow:inset -4px 0 0 rgba(0,0,0,.12)}.arm.left{left:13px;transform:rotate(8deg)}.arm.right{right:13px;transform:rotate(-8deg)}
.leg{position:absolute;top:125px;width:25px;height:83px;border-radius:13px;transform-origin:50% 5%;box-shadow:inset -5px 0 0 rgba(0,0,0,.14)}.leg.left{left:28px}.leg.right{right:28px}
.redSkin{background:var(--red)}.redDark{background:var(--red2)}.blueSkin{background:var(--blue)}.blueDark{background:var(--blue2)}
.nameTag{position:absolute;top:-29px;left:50%;transform:translateX(-50%);background:rgba(6,16,30,.74);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:950;white-space:nowrap}
#red.punching .arm.right{animation:redPunch .28s ease}#blue.punching .arm.left{animation:bluePunch .28s ease}#red.kicking .leg.right{animation:redKick .38s ease}#blue.kicking .leg.left{animation:blueKick .38s ease}#red.dashing{animation:redDash .34s ease}#blue.dashing{animation:blueDash .34s ease}#red.jumping,#blue.jumping{animation:jump .52s ease}.blocking .arm.left{transform:rotate(-55deg) translate(14px,-8px)}.blocking .arm.right{transform:rotate(55deg) translate(-14px,-8px)}.hurt{filter:brightness(1.9)}.ko{transform:rotate(78deg) translateY(25px)!important}
@keyframes redPunch{50%{transform:rotate(-88deg) translateY(-24px) scaleY(1.2)}}@keyframes bluePunch{50%{transform:rotate(88deg) translateY(-24px) scaleY(1.2)}}@keyframes redKick{50%{transform:rotate(-65deg) translateY(-15px)}}@keyframes blueKick{50%{transform:rotate(65deg) translateY(-15px)}}@keyframes redDash{45%{transform:translateX(95px) scale(1.06)}}@keyframes blueDash{45%{transform:translateX(-95px) scale(1.06)}}@keyframes jump{50%{transform:translateY(-80px)}}
#controls{position:absolute;z-index:50;inset:0;pointer-events:none}#dpad{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(15px,env(safe-area-inset-bottom));width:158px;height:158px;pointer-events:none}
.dir,.action{pointer-events:auto;touch-action:manipulation;color:white;border:3px solid rgba(255,255,255,.7);box-shadow:0 7px 20px rgba(0,0,0,.25);font-weight:1000;text-shadow:0 2px 3px rgba(0,0,0,.28);cursor:pointer}.dir{position:absolute;width:58px;height:58px;border-radius:17px;background:rgba(9,27,51,.82);font-size:27px}.dir:active,.action:active{transform:scale(.92);filter:brightness(1.25)}#up{left:50px;top:0}#left{left:0;top:50px}#right{right:0;top:50px}#down{left:50px;bottom:0}#moveWord{position:absolute;left:50px;top:62px;width:58px;height:34px;display:grid;place-items:center;background:rgba(8,20,38,.5);border-radius:12px;font-size:9px;font-weight:950;letter-spacing:.08em}
#actions{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(2,84px);grid-auto-rows:59px;gap:8px;pointer-events:none}.action{border-radius:17px;font-size:11px}#punch{background:#d9213d}#kick{background:#e65c32}#dash{background:#7b36cf}#power{background:#f29b13}#block{background:#1b75cb}#jump{background:#149d6f}
#restart{position:absolute;z-index:80;left:50%;bottom:34px;transform:translateX(-50%);display:none;border:0;border-radius:999px;background:white;color:#102039;padding:14px 22px;font-size:15px;font-weight:1000;box-shadow:0 8px 26px rgba(0,0,0,.3)}#win{position:absolute;z-index:70;left:50%;top:38%;transform:translate(-50%,-50%);font-size:clamp(42px,9vw,88px);font-weight:1000;text-align:center;text-shadow:0 8px 25px rgba(0,0,0,.45);display:none;width:90vw}#win small{display:block;font-size:15px;margin-top:8px}#powerBall{position:absolute;z-index:15;width:28px;height:28px;border-radius:50%;display:none;background:white;box-shadow:0 0 8px white,0 0 25px #ffd947,0 0 48px #ff8b00}
@media (orientation:portrait){#hud{grid-template-columns:1fr 1fr}#round{position:absolute;top:70px;left:50%;transform:translateX(-50%)}#status{top:118px}#stage{top:52%;height:390px}.fighter{transform:scale(.88);transform-origin:50% 90%}#red{left:7%}#blue{left:62%}#dpad{transform:scale(.88);transform-origin:left bottom}#actions{transform:scale(.88);transform-origin:right bottom}}
@media(max-width:430px){#dpad{transform:scale(.78);transform-origin:left bottom}#actions{transform:scale(.78);transform-origin:right bottom}.hudBox{padding:7px 8px}.hudName{font-size:10px}}
</style>
</head>
<body>
<div id="game"><div id="mountains"></div><div id="arena"></div>
<div id="hud"><div class="hudBox"><div class="hudName">🔴 YOU · RED</div><div class="bar"><div class="fill" id="redHp"></div></div><div class="bar energy"><div class="fill" id="redEn"></div></div></div><div id="round">ROUND 1</div><div class="hudBox ai"><div class="hudName">🔵 CHATGPT AI · BLUE</div><div class="bar"><div class="fill" id="blueHp"></div></div><div class="bar energy"><div class="fill" id="blueEn"></div></div></div></div>
<div id="status">Tap PUNCH. RED should hit BLUE right away.</div>
<div id="stage">
<div class="fighter" id="red"><div class="nameTag">YOU</div><div class="shadow"></div><div class="person"><div class="hair"></div><div class="head redSkin"></div><div class="eye e1"></div><div class="eye e2"></div><div class="pupil p1"></div><div class="pupil p2"></div><div class="body redSkin"></div><div class="arm left redSkin"></div><div class="arm right redSkin"></div><div class="leg left redDark"></div><div class="leg right redDark"></div></div></div>
<div class="fighter" id="blue"><div class="nameTag">CHATGPT AI</div><div class="shadow"></div><div class="person"><div class="hair"></div><div class="head blueSkin"></div><div class="eye e1"></div><div class="eye e2"></div><div class="pupil p1"></div><div class="pupil p2"></div><div class="body blueSkin"></div><div class="arm left blueSkin"></div><div class="arm right blueSkin"></div><div class="leg left blueDark"></div><div class="leg right blueDark"></div></div></div>
<div id="powerBall"></div></div>
<div id="win"></div><button id="restart" type="button">FIGHT AGAIN</button>
<div id="controls"><div id="dpad"><button class="dir" id="up" type="button">▲</button><button class="dir" id="left" type="button">◀</button><div id="moveWord">MOVE</div><button class="dir" id="right" type="button">▶</button><button class="dir" id="down" type="button">▼</button></div><div id="actions"><button class="action" id="punch" type="button">👊 PUNCH</button><button class="action" id="kick" type="button">🦵 KICK</button><button class="action" id="dash" type="button">💨 DASH</button><button class="action" id="power" type="button">⚡ POWER</button><button class="action" id="block" type="button">🛡 BLOCK</button><button class="action" id="jump" type="button">⬆ JUMP</button></div></div></div>
<script>
(function(){"use strict";const $=id=>document.getElementById(id);const red=$("red"),blue=$("blue"),redHpBar=$("redHp"),blueHpBar=$("blueHp"),redEnBar=$("redEn"),blueEnBar=$("blueEn"),status=$("status"),win=$("win"),restart=$("restart"),powerBall=$("powerBall");let redHp=100,blueHp=100,redEn=100,blueEn=100,redX=17,blueX=68,round=1,over=false,redBlocking=false,blueBlocking=false,redBusy=false,blueBusy=false;
function update(){redHpBar.style.width=redHp+"%";blueHpBar.style.width=blueHp+"%";redEnBar.style.width=redEn+"%";blueEnBar.style.width=blueEn+"%";red.style.left=redX+"%";blue.style.left=blueX+"%"}function say(text){status.textContent=text}function flash(el){el.classList.add("hurt");setTimeout(()=>el.classList.remove("hurt"),130)}function animate(el,cls,time){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),time)}function distance(){return Math.abs(blueX-redX)}function hurtBlue(amount){if(over)return;if(blueBlocking)amount=Math.ceil(amount*.3);blueHp=Math.max(0,blueHp-amount);flash(blue);update();if(blueHp<=0)finish(true)}function hurtRed(amount){if(over)return;if(redBlocking)amount=Math.ceil(amount*.3);redHp=Math.max(0,redHp-amount);flash(red);update();if(redHp<=0)finish(false)}
function punch(){if(over||redBusy)return;redBusy=true;animate(red,"punching",300);say("RED PUNCH!");setTimeout(()=>{if(distance()<=58)hurtBlue(10);else say("Move closer to BLUE!")},130);setTimeout(()=>redBusy=false,330)}function kick(){if(over||redBusy)return;redBusy=true;animate(red,"kicking",400);say("RED KICK!");setTimeout(()=>{if(distance()<=60)hurtBlue(15);else say("Move closer to BLUE!")},180);setTimeout(()=>redBusy=false,430)}function dash(){if(over||redBusy||redEn<18)return;redBusy=true;redEn-=18;update();animate(red,"dashing",350);say("RED DASH ATTACK!");setTimeout(()=>{redX=Math.min(blueX-12,redX+18);hurtBlue(17);update()},160);setTimeout(()=>redBusy=false,370)}function power(){if(over||redBusy||redEn<25)return;redBusy=true;redEn-=25;update();say("RED POWER BLAST!");const stage=$("stage").getBoundingClientRect(),rr=red.getBoundingClientRect(),br=blue.getBoundingClientRect();powerBall.style.display="block";powerBall.style.left=(rr.left-stage.left+rr.width*.72)+"px";powerBall.style.top=(rr.top-stage.top+80)+"px";powerBall.style.transition="none";requestAnimationFrame(()=>{powerBall.style.transition="left .34s linear, top .34s linear";powerBall.style.left=(br.left-stage.left+20)+"px";powerBall.style.top=(br.top-stage.top+82)+"px"});setTimeout(()=>{powerBall.style.display="none";hurtBlue(20);redBusy=false},360)}function block(){if(over)return;redBlocking=true;red.classList.add("blocking");say("RED BLOCK!");setTimeout(()=>{redBlocking=false;red.classList.remove("blocking")},800)}function jump(){if(over||redBusy)return;redBusy=true;animate(red,"jumping",540);say("RED JUMP!");setTimeout(()=>redBusy=false,560)}function move(dir){if(over)return;if(dir==="left")redX=Math.max(1,redX-6);if(dir==="right")redX=Math.min(blueX-8,redX+6);if(dir==="up")say("RED moves forward!");if(dir==="down")say("RED moves back!");if(dir==="left"||dir==="right")say("RED moved "+dir.toUpperCase()+"!");update()}
function blueAttack(){if(over||blueBusy)return;blueBusy=true;blueBlocking=false;blue.classList.remove("blocking");const r=Math.random();if(r<.18){blueBlocking=true;blue.classList.add("blocking");say("BLUE is blocking!");setTimeout(()=>{blueBlocking=false;blue.classList.remove("blocking");blueBusy=false},650);return}if(distance()>44){blueX=Math.max(redX+13,blueX-7);say("BLUE moves closer.");update();setTimeout(()=>blueBusy=false,380);return}if(r<.58){animate(blue,"punching",300);say("BLUE PUNCHES!");setTimeout(()=>hurtRed(8),135);setTimeout(()=>blueBusy=false,340)}else if(r<.86){animate(blue,"kicking",400);say("BLUE KICKS!");setTimeout(()=>hurtRed(12),185);setTimeout(()=>blueBusy=false,440)}else{animate(blue,"dashing",350);say("BLUE DASH ATTACK!");blueX=Math.max(redX+12,blueX-10);update();setTimeout(()=>hurtRed(15),165);setTimeout(()=>blueBusy=false,390)}}
function finish(redWon){over=true;if(redWon){blue.classList.add("ko");win.innerHTML="RED WINS!<small>You beat ChatGPT AI!</small>";say("You won the fight!")}else{red.classList.add("ko");win.innerHTML="BLUE WINS!<small>ChatGPT AI wins this round.</small>";say("BLUE won this round. Rematch!")}win.style.display="block";restart.style.display="block"}function reset(){redHp=100;blueHp=100;redEn=100;blueEn=100;redX=17;blueX=68;over=false;redBlocking=false;blueBlocking=false;redBusy=false;blueBusy=false;round++;$("round").textContent="ROUND "+round;red.className="fighter";blue.className="fighter";win.style.display="none";restart.style.display="none";say("Fight! Tap PUNCH first.");update()}
$("punch").onclick=punch;$("kick").onclick=kick;$("dash").onclick=dash;$("power").onclick=power;$("block").onclick=block;$("jump").onclick=jump;$("left").onclick=()=>move("left");$("right").onclick=()=>move("right");$("up").onclick=()=>move("up");$("down").onclick=()=>move("down");restart.onclick=reset;
addEventListener("keydown",e=>{if(e.code==="KeyJ")punch();if(e.code==="KeyK")kick();if(e.code==="KeyL")dash();if(e.code==="KeyI")power();if(e.code==="Space")jump();if(e.code==="ShiftLeft"||e.code==="ShiftRight")block();if(e.code==="ArrowLeft"||e.code==="KeyA")move("left");if(e.code==="ArrowRight"||e.code==="KeyD")move("right")});
setInterval(()=>{if(!over)blueAttack();redEn=Math.min(100,redEn+4);blueEn=Math.min(100,blueEn+4);update()},1050);update()})();
</script>
</body>
</html>
