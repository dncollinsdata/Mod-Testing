<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#081426">
<title>AI Arena V7</title>
<style>
:root{--red:#f2384f;--red2:#9a1830;--blue:#2c7fff;--blue2:#113a99;--ink:#081426;--panel:#0d213a;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#66c9ff;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none}
button{font:inherit;-webkit-appearance:none;appearance:none;border:0}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(#67caff 0 56%,#6ccd85 56% 100%)}
#hud{z-index:20;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 6px;background:linear-gradient(#081426f2,#081426d9)}
.card{background:#102642;border:1px solid #ffffff30;border-radius:14px;padding:7px 9px;box-shadow:0 6px 18px #0004}.card.ai{text-align:right}.name{font-size:11px;font-weight:950;letter-spacing:.04em;margin-bottom:5px}.bar{height:13px;border-radius:999px;overflow:hidden;background:#263a56}.fill{height:100%;width:100%;transition:width .12s linear}.meter{height:6px;margin-top:5px}#redHP{background:linear-gradient(90deg,#ff8c66,var(--red))}#blueHP{background:linear-gradient(90deg,#67dbff,var(--blue))}#redEN{background:var(--gold)}#blueEN{background:#62f0ff}#round{align-self:start;background:#102642;border:1px solid #ffffff30;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:950;white-space:nowrap}
#world{position:relative;min-height:0;overflow:hidden;background:radial-gradient(circle at 50% 12%,#ffffffdd 0 5%,#ffffff00 23%),linear-gradient(transparent 0 45%,#4e849955 45% 46%,transparent 46%)}
#mountains{position:absolute;left:-5%;right:-5%;top:28%;height:31%;background:#477c95;opacity:.36;clip-path:polygon(0 100%,0 72%,8% 28%,16% 72%,27% 8%,39% 75%,52% 22%,63% 76%,76% 5%,88% 70%,100% 27%,100% 100%)}
#arena{position:absolute;left:4%;right:4%;bottom:3%;height:61%;border-radius:50%;background:repeating-linear-gradient(0deg,#405b6b1a 0 2px,transparent 2px 34px),repeating-linear-gradient(90deg,#405b6b1a 0 2px,transparent 2px 34px),#eef3f5;border:7px solid #3d5769;transform:perspective(700px) rotateX(61deg);box-shadow:0 28px 40px #0003}
#status{position:absolute;z-index:12;left:50%;top:10px;transform:translateX(-50%);max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#081426df;border:1px solid #ffffff38;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:900}
#combo{position:absolute;z-index:12;right:10px;top:50px;background:#081426c7;border:1px solid #ffffff30;border-radius:12px;padding:6px 9px;font-size:10px;font-weight:950;opacity:0;transition:opacity .15s}.fighter{position:absolute;z-index:7;bottom:10%;width:100px;height:205px;transform-origin:50% 92%;transition:left .05s linear,filter .1s}.shadow{position:absolute;left:10px;bottom:0;width:80px;height:18px;border-radius:50%;background:#0004}.badge{position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:950;background:#061528ca;border:1px solid #ffffff38;border-radius:999px;padding:4px 7px;white-space:nowrap}.hair{position:absolute;z-index:2;left:29px;top:-2px;width:44px;height:18px;border-radius:50% 50% 24% 24%;background:#17243b}.head{position:absolute;left:30px;top:0;width:42px;height:49px;border-radius:48%;box-shadow:inset -6px -4px #0002}.eye{position:absolute;z-index:3;top:21px;width:5px;height:5px;border-radius:50%;background:#fff}.eye.a{left:41px}.eye.b{left:58px}.body{position:absolute;left:23px;top:47px;width:56px;height:74px;border-radius:16px}.arm{position:absolute;top:53px;width:19px;height:70px;border-radius:12px;transform-origin:50% 8%}.arm.left{left:8px;transform:rotate(7deg)}.arm.right{right:8px;transform:rotate(-7deg)}.leg{position:absolute;top:116px;width:22px;height:78px;border-radius:12px;transform-origin:50% 5%}.leg.left{left:24px}.leg.right{right:24px}.red .head,.red .body,.red .arm{background:var(--red)}.red .leg{background:var(--red2)}.blue .head,.blue .body,.blue .arm{background:var(--blue)}.blue .leg{background:var(--blue2)}
.punch.red .arm.right{animation:punchR .24s}.punch.blue .arm.left{animation:punchL .24s}.kick.red .leg.right{animation:kickR .34s}.kick.blue .leg.left{animation:kickL .34s}.dash.red{animation:dashR .28s}.dash.blue{animation:dashL .28s}.jump{animation:jump .46s}.block .arm.left{transform:rotate(-58deg) translate(11px,-8px)}.block .arm.right{transform:rotate(58deg) translate(-11px,-8px)}.hurt{filter:brightness(1.9)}.ko.red{transform:rotate(78deg) translateY(22px)}.ko.blue{transform:rotate(-78deg) translateY(22px)}
@keyframes punchR{50%{transform:rotate(-85deg) translateY(-21px)}}@keyframes punchL{50%{transform:rotate(85deg) translateY(-21px)}}@keyframes kickR{50%{transform:rotate(-64deg) translateY(-14px)}}@keyframes kickL{50%{transform:rotate(64deg) translateY(-14px)}}@keyframes dashR{45%{transform:translateX(64px) scale(1.04)}}@keyframes dashL{45%{transform:translateX(-64px) scale(1.04)}}@keyframes jump{50%{transform:translateY(-62px)}}
#orb{display:none;position:absolute;z-index:9;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 25px #ffcb31,0 0 44px #ff7b00}
#overlay{display:none;position:absolute;inset:0;z-index:40;background:#071629c2;align-items:center;justify-content:center;flex-direction:column;text-align:center;backdrop-filter:blur(3px)}#overlay.show{display:flex}#result{font-size:44px;font-weight:1000;text-shadow:0 6px 18px #0008}#sub{font-size:13px;font-weight:800;margin:8px 0 18px}#again{border-radius:999px;padding:13px 22px;background:#fff;color:#102039;font-weight:1000;pointer-events:auto}
#controls{z-index:25;background:linear-gradient(#0b1b30,#071426);padding:8px max(9px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));display:grid;grid-template-columns:132px 1fr;gap:8px}.movePad{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{min-height:54px;border:2px solid #ffffff70;border-radius:15px;color:#fff;font-size:10px;font-weight:1000;box-shadow:0 5px 12px #0004;touch-action:none;user-select:none;-webkit-user-select:none;pointer-events:auto}.btn:active,.btn.active{transform:scale(.94);filter:brightness(1.28)}.dir{background:#263d5d;font-size:22px}.punchBtn{background:#d7243f}.kickBtn{background:#dd6135}.dashBtn{background:#7a39ca}.powerBtn{background:#e59612}.blockBtn{background:#2473bc}.jumpBtn{background:#159a6f}
#testReport{display:none}
@media (orientation:portrait){#hud{grid-template-columns:1fr 1fr}#round{position:absolute;left:50%;top:67px;transform:translateX(-50%)}#status{top:42px}.fighter{transform:scale(.88);transform-origin:bottom center}#controls{grid-template-columns:112px 1fr}.btn{min-height:49px}}
@media(max-width:420px){#controls{grid-template-columns:100px 1fr;gap:6px;padding-top:6px}.movePad,.actions{gap:5px}.btn{min-height:46px;font-size:9px}.fighter{transform:scale(.82);transform-origin:bottom center}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="card"><div class="name">🔴 YOU · RED</div><div class="bar"><div class="fill" id="redHP"></div></div><div class="bar meter"><div class="fill" id="redEN"></div></div></div>
    <div id="round">ROUND 1</div>
    <div class="card ai"><div class="name">🔵 CHATGPT AI · BLUE</div><div class="bar"><div class="fill" id="blueHP"></div></div><div class="bar meter"><div class="fill" id="blueEN"></div></div></div>
  </div>
  <div id="world">
    <div id="mountains"></div><div id="arena"></div><div id="status">Fight! RED starts close enough to punch BLUE.</div><div id="combo">COMBO x2</div>
    <div class="fighter red" id="red"><div class="badge">YOU</div><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="eye a"></div><div class="eye b"></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div></div>
    <div class="fighter blue" id="blue"><div class="badge">CHATGPT AI</div><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="eye a"></div><div class="eye b"></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div></div>
    <div id="orb"></div>
    <div id="overlay"><div id="result"></div><div id="sub"></div><button id="again" type="button">FIGHT AGAIN</button></div>
    <div id="testReport"></div>
  </div>
  <div id="controls">
    <div class="movePad"><button id="leftBtn" class="btn dir" type="button">◀ LEFT</button><button id="rightBtn" class="btn dir" type="button">RIGHT ▶</button></div>
    <div class="actions"><button id="punchBtn" class="btn punchBtn" type="button">👊 PUNCH</button><button id="kickBtn" class="btn kickBtn" type="button">🦵 KICK</button><button id="dashBtn" class="btn dashBtn" type="button">💨 DASH</button><button id="powerBtn" class="btn powerBtn" type="button">⚡ POWER</button><button id="blockBtn" class="btn blockBtn" type="button">🛡 BLOCK</button><button id="jumpBtn" class="btn jumpBtn" type="button">⬆ JUMP</button></div>
  </div>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const el={red:$('red'),blue:$('blue'),redHP:$('redHP'),blueHP:$('blueHP'),redEN:$('redEN'),blueEN:$('blueEN'),status:$('status'),round:$('round'),orb:$('orb'),overlay:$('overlay'),result:$('result'),sub:$('sub'),again:$('again'),left:$('leftBtn'),right:$('rightBtn'),punch:$('punchBtn'),kick:$('kickBtn'),dash:$('dashBtn'),power:$('powerBtn'),block:$('blockBtn'),jump:$('jumpBtn'),combo:$('combo'),testReport:$('testReport')};
const game={round:1,over:false,redHP:100,blueHP:100,redEN:100,blueEN:100,redX:32,blueX:54,move:0,redBusy:false,blueBusy:false,redBlock:false,blueBlock:false,combo:0,lastHit:0,last:performance.now(),aiTimer:0};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=()=>Math.abs(game.blueX-game.redX);
function say(t){el.status.textContent=t}
function updateUI(){el.redHP.style.width=game.redHP+'%';el.blueHP.style.width=game.blueHP+'%';el.redEN.style.width=game.redEN+'%';el.blueEN.style.width=game.blueEN+'%';el.red.style.left=game.redX+'%';el.blue.style.left=game.blueX+'%'}
function anim(node,cls,ms){node.classList.remove(cls);void node.offsetWidth;node.classList.add(cls);setTimeout(()=>node.classList.remove(cls),ms)}
function flash(node){node.classList.add('hurt');setTimeout(()=>node.classList.remove('hurt'),120)}
function registerCombo(){const now=performance.now();game.combo=now-game.lastHit<900?game.combo+1:1;game.lastHit=now;if(game.combo>=2){el.combo.textContent='COMBO x'+game.combo;el.combo.style.opacity='1';setTimeout(()=>{if(performance.now()-game.lastHit>800)el.combo.style.opacity='0'},900)}}
function damageBlue(n){if(game.over)return;if(game.blueBlock)n=Math.ceil(n*.3);game.blueHP=clamp(game.blueHP-n,0,100);registerCombo();flash(el.blue);updateUI();if(game.blueHP<=0)endFight(true)}
function damageRed(n){if(game.over)return;if(game.redBlock)n=Math.ceil(n*.28);game.redHP=clamp(game.redHP-n,0,100);flash(el.red);updateUI();if(game.redHP<=0)endFight(false)}
function endFight(redWon){game.over=true;game.move=0;(redWon?el.blue:el.red).classList.add('ko');el.result.textContent=redWon?'RED WINS!':'BLUE WINS!';el.sub.textContent=redWon?'You beat ChatGPT AI!':'ChatGPT AI wins this round.';el.overlay.classList.add('show')}
function melee(label,cls,damage,range,ms,delay){if(game.over||game.redBusy)return;game.redBusy=true;anim(el.red,cls,ms);say('RED '+label+'!');setTimeout(()=>{if(dist()<=range)damageBlue(damage);else say('Too far away. Hold RIGHT or use DASH.')},delay);setTimeout(()=>game.redBusy=false,ms+40)}
function punch(){melee('PUNCH','punch',9,24,250,110)}
function kick(){melee('KICK','kick',14,28,350,155)}
function dash(){if(game.over||game.redBusy||game.redEN<18)return;game.redBusy=true;game.redEN-=18;game.redX=Math.min(game.blueX-8,game.redX+12);anim(el.red,'dash',290);say('RED DASH ATTACK!');updateUI();setTimeout(()=>{if(dist()<=20)damageBlue(16)},120);setTimeout(()=>game.redBusy=false,330)}
function power(){if(game.over||game.redBusy||game.redEN<25)return;game.redBusy=true;game.redEN-=25;updateUI();say('RED POWER BLAST!');const world=$('world').getBoundingClientRect(),rr=el.red.getBoundingClientRect(),br=el.blue.getBoundingClientRect();el.orb.style.display='block';el.orb.style.transition='none';el.orb.style.left=(rr.left-world.left+rr.width*.65)+'px';el.orb.style.top=(rr.top-world.top+72)+'px';requestAnimationFrame(()=>{el.orb.style.transition='left .32s linear,top .32s linear';el.orb.style.left=(br.left-world.left+18)+'px';el.orb.style.top=(br.top-world.top+72)+'px'});setTimeout(()=>{el.orb.style.display='none';damageBlue(19);game.redBusy=false},340)}
function jump(){if(game.over||game.redBusy)return;game.redBusy=true;anim(el.red,'jump',470);say('RED JUMP!');setTimeout(()=>game.redBusy=false,490)}
function setBlock(on){if(game.over)return;game.redBlock=on;el.red.classList.toggle('block',on);if(on)say('RED BLOCKING!')}
function moveStep(dir){if(game.over)return;game.redX=clamp(game.redX+dir*3.5,2,game.blueX-7);say(dir>0?'RED moves RIGHT':'RED moves LEFT');updateUI()}
function aiAct(){if(game.over||game.blueBusy)return;game.blueBusy=true;game.blueBlock=false;el.blue.classList.remove('block');const d=dist();const r=Math.random();if(d>23){game.blueX=Math.max(game.redX+8,game.blueX-5);say('BLUE moves closer.');updateUI();setTimeout(()=>game.blueBusy=false,360);return}if(r<.16){game.blueBlock=true;el.blue.classList.add('block');say('BLUE BLOCKS!');setTimeout(()=>{game.blueBlock=false;el.blue.classList.remove('block');game.blueBusy=false},650);return}if(r<.58){anim(el.blue,'punch',250);say('BLUE PUNCH!');setTimeout(()=>damageRed(7),115);setTimeout(()=>game.blueBusy=false,300)}else if(r<.87){anim(el.blue,'kick',350);say('BLUE KICK!');setTimeout(()=>damageRed(11),155);setTimeout(()=>game.blueBusy=false,400)}else{game.blueX=Math.max(game.redX+8,game.blueX-9);anim(el.blue,'dash',290);say('BLUE DASH!');updateUI();setTimeout(()=>damageRed(14),120);setTimeout(()=>game.blueBusy=false,340)}}
function reset(){game.round++;game.over=false;game.redHP=100;game.blueHP=100;game.redEN=100;game.blueEN=100;game.redX=32;game.blueX=54;game.move=0;game.redBusy=false;game.blueBusy=false;game.redBlock=false;game.blueBlock=false;game.combo=0;el.red.className='fighter red';el.blue.className='fighter blue';el.overlay.classList.remove('show');el.round.textContent='ROUND '+game.round;say('Fight! Tap PUNCH right away.');updateUI()}
function bindAction(button,fn){button.addEventListener('click',e=>{e.preventDefault();fn()});button.addEventListener('touchend',e=>{e.preventDefault();fn()},{passive:false})}
function bindMove(button,dir){const start=e=>{if(e)e.preventDefault();game.move=dir;button.classList.add('active');moveStep(dir)};const stop=e=>{if(e)e.preventDefault();if(game.move===dir)game.move=0;button.classList.remove('active')};button.addEventListener('pointerdown',start);button.addEventListener('pointerup',stop);button.addEventListener('pointercancel',stop);button.addEventListener('pointerleave',stop);button.addEventListener('touchstart',start,{passive:false});button.addEventListener('touchend',stop,{passive:false});button.addEventListener('click',e=>{e.preventDefault();moveStep(dir)})}
bindMove(el.left,-1);bindMove(el.right,1);bindAction(el.punch,punch);bindAction(el.kick,kick);bindAction(el.dash,dash);bindAction(el.power,power);bindAction(el.jump,jump);
el.block.addEventListener('pointerdown',e=>{e.preventDefault();setBlock(true);el.block.classList.add('active')});el.block.addEventListener('pointerup',e=>{e.preventDefault();setBlock(false);el.block.classList.remove('active')});el.block.addEventListener('pointercancel',()=>{setBlock(false);el.block.classList.remove('active')});el.block.addEventListener('touchstart',e=>{e.preventDefault();setBlock(true)},{passive:false});el.block.addEventListener('touchend',e=>{e.preventDefault();setBlock(false)},{passive:false});el.block.addEventListener('click',e=>{e.preventDefault();setBlock(true);setTimeout(()=>setBlock(false),550)});el.again.addEventListener('click',reset);
addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')game.move=-1;if(e.code==='ArrowRight'||e.code==='KeyD')game.move=1;if(e.code==='KeyJ')punch();if(e.code==='KeyK')kick();if(e.code==='KeyL')dash();if(e.code==='KeyI')power();if(e.code==='Space')jump();if(e.code==='ShiftLeft'||e.code==='ShiftRight')setBlock(true)});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA','ArrowRight','KeyD'].includes(e.code))game.move=0;if(e.code==='ShiftLeft'||e.code==='ShiftRight')setBlock(false)});
function tick(now){const dt=Math.min(.034,(now-game.last)/1000);game.last=now;if(!game.over){if(game.move){game.redX=clamp(game.redX+game.move*22*dt,2,game.blueX-7);updateUI()}game.redEN=clamp(game.redEN+8*dt,0,100);game.blueEN=clamp(game.blueEN+7*dt,0,100);game.aiTimer-=dt;if(game.aiTimer<=0){game.aiTimer=1.15+Math.random()*.35;aiAct()}updateUI()}requestAnimationFrame(tick)}
updateUI();requestAnimationFrame(tick);
window.__arena={game,punch,kick,dash,power,jump,setBlock,moveStep,reset,damageBlue,damageRed};
if(new URLSearchParams(location.search).get('test')==='1'){
  (async()=>{
    const wait=ms=>new Promise(r=>setTimeout(r,ms));const results=[];const check=(name,ok)=>results.push(name+':'+(ok?'PASS':'FAIL'));
    game.aiTimer=999;const startX=game.redX;el.right.click();await wait(80);check('move-right',game.redX>startX);
    const hp1=game.blueHP;el.punch.click();await wait(320);check('punch-damage',game.blueHP<hp1);
    const hp2=game.blueHP;el.kick.click();await wait(420);check('kick-damage',game.blueHP<hp2);
    const en1=game.redEN;el.dash.click();await wait(380);check('dash-energy',game.redEN<en1);
    const hp3=game.blueHP;el.power.click();await wait(430);check('power-damage',game.blueHP<hp3);
    el.block.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true}));await wait(30);check('block-on',game.redBlock===true);el.block.dispatchEvent(new PointerEvent('pointerup',{bubbles:true}));await wait(30);check('block-off',game.redBlock===false);
    el.jump.click();await wait(30);check('jump-animation',el.red.classList.contains('jump'));
    game.blueHP=1;game.redBusy=false;el.punch.click();await wait(250);check('win-overlay',el.overlay.classList.contains('show'));
    el.again.click();await wait(50);check('restart',!game.over&&game.blueHP===100&&game.redHP===100);
    el.testReport.style.display='block';el.testReport.textContent=results.join('|');document.documentElement.setAttribute('data-test',results.every(x=>x.endsWith('PASS'))?'PASS':'FAIL');
  })();
}
})();
</script>
</body>
</html>
