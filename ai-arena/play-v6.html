<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#081426"><title>AI Arena Mobile V6</title>
<style>
:root{--red:#f2384f;--red2:#98182c;--blue:#3183ff;--blue2:#123b9a;--ink:#081426;--panel:#0d213a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#65c7ff;color:#fff;overscroll-behavior:none}button{font:inherit;-webkit-appearance:none;appearance:none}#app{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(#67c9ff 0 56%,#6dcc85 56% 100%);touch-action:none}#hud{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px 6px;background:linear-gradient(#081426ef,#081426d9);z-index:20}.card{background:#102642;border:1px solid #ffffff2e;border-radius:14px;padding:7px 9px;box-shadow:0 6px 18px #0004}.card.ai{text-align:right}.name{font-weight:950;font-size:11px;letter-spacing:.04em;margin-bottom:5px}.bar{height:13px;background:#263a56;border-radius:999px;overflow:hidden}.fill{height:100%;width:100%;transition:width .12s linear}#redHP{background:linear-gradient(90deg,#ff865f,var(--red))}#blueHP{background:linear-gradient(90deg,#65d8ff,var(--blue))}.meter{height:6px;margin-top:5px}#redEN{background:#ffc63d}#blueEN{background:#62f0ff}#round{align-self:start;background:#102642;border:1px solid #ffffff2e;border-radius:999px;padding:7px 10px;font-size:10px;font-weight:950;white-space:nowrap}#world{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 12%,#ffffffcc 0 5%,#ffffff00 22%),linear-gradient(transparent 0 46%,#4d879c55 46% 47%,transparent 47%)}#mountains{position:absolute;left:-5%;right:-5%;top:28%;height:31%;background:#477b94;opacity:.36;clip-path:polygon(0 100%,0 71%,8% 28%,16% 72%,27% 8%,39% 74%,52% 22%,63% 75%,76% 4%,87% 69%,100% 26%,100% 100%)}#arena{position:absolute;left:4%;right:4%;bottom:4%;height:60%;border-radius:50%;background:repeating-linear-gradient(0deg,#405b6b1a 0 2px,transparent 2px 34px),repeating-linear-gradient(90deg,#405b6b1a 0 2px,transparent 2px 34px),#edf2f4;border:7px solid #3c5668;transform:perspective(700px) rotateX(61deg);box-shadow:0 28px 40px #0003}#status{position:absolute;z-index:12;left:50%;top:10px;transform:translateX(-50%);max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#081426d9;border:1px solid #ffffff35;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:900}.fighter{position:absolute;z-index:7;bottom:10%;width:100px;height:205px;transform-origin:50% 92%;transition:filter .1s}#red{left:15%}#blue{left:70%}.shadow{position:absolute;left:10px;bottom:0;width:80px;height:18px;border-radius:50%;background:#0004;filter:blur(1px)}.head{position:absolute;left:30px;top:0;width:42px;height:49px;border-radius:48%;box-shadow:inset -6px -4px #0002}.hair{position:absolute;z-index:2;left:29px;top:-2px;width:44px;height:18px;border-radius:50% 50% 24% 24%;background:#17243b}.eye{position:absolute;z-index:3;top:21px;width:5px;height:5px;border-radius:50%;background:#fff}.eye.a{left:41px}.eye.b{left:58px}.body{position:absolute;left:23px;top:47px;width:56px;height:74px;border-radius:16px}.arm{position:absolute;top:53px;width:19px;height:70px;border-radius:12px;transform-origin:50% 8%}.arm.left{left:8px;transform:rotate(7deg)}.arm.right{right:8px;transform:rotate(-7deg)}.leg{position:absolute;top:116px;width:22px;height:78px;border-radius:12px;transform-origin:50% 5%}.leg.left{left:24px}.leg.right{right:24px}.red .head,.red .body,.red .arm{background:var(--red)}.red .leg{background:var(--red2)}.blue .head,.blue .body,.blue .arm{background:var(--blue)}.blue .leg{background:var(--blue2)}.badge{position:absolute;top:-25px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:950;background:#061528c9;border:1px solid #ffffff38;border-radius:999px;padding:4px 7px;white-space:nowrap}.punch.red .arm.right{animation:punchR .25s}.punch.blue .arm.left{animation:punchL .25s}.kick.red .leg.right{animation:kickR .34s}.kick.blue .leg.left{animation:kickL .34s}.dash.red{animation:dashR .30s}.dash.blue{animation:dashL .30s}.jump{animation:jump .48s}.block .arm.left{transform:rotate(-58deg) translate(11px,-8px)}.block .arm.right{transform:rotate(58deg) translate(-11px,-8px)}.hurt{filter:brightness(1.9)}.ko.red{transform:rotate(78deg) translateY(22px)}.ko.blue{transform:rotate(-78deg) translateY(22px)}@keyframes punchR{50%{transform:rotate(-84deg) translateY(-21px)}}@keyframes punchL{50%{transform:rotate(84deg) translateY(-21px)}}@keyframes kickR{50%{transform:rotate(-64deg) translateY(-14px)}}@keyframes kickL{50%{transform:rotate(64deg) translateY(-14px)}}@keyframes dashR{45%{transform:translateX(68px) scale(1.04)}}@keyframes dashL{45%{transform:translateX(-68px) scale(1.04)}}@keyframes jump{50%{transform:translateY(-62px)}}#orb{display:none;position:absolute;z-index:9;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff,0 0 25px #ffcb31,0 0 44px #ff7b00}#overlay{display:none;position:absolute;inset:0;z-index:30;background:#071629b5;backdrop-filter:blur(3px);align-items:center;justify-content:center;flex-direction:column;text-align:center}#overlay.show{display:flex}#result{font-size:44px;font-weight:1000;text-shadow:0 6px 18px #0008;margin-bottom:8px}#sub{font-size:13px;font-weight:800;margin-bottom:18px}#again{border:0;border-radius:999px;padding:13px 22px;background:white;color:#102039;font-weight:1000}#controls{flex:0 0 auto;z-index:25;background:linear-gradient(#0b1b30,#071426);padding:8px max(9px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left));display:grid;grid-template-columns:126px 1fr;gap:8px;touch-action:none}#movePad{display:grid;grid-template-columns:1fr 1fr;gap:7px}#actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.btn{min-height:52px;border:2px solid #ffffff70;border-radius:15px;color:#fff;font-size:10px;font-weight:1000;box-shadow:0 5px 12px #0004;touch-action:none;user-select:none;-webkit-user-select:none}.btn:active,.btn.active{transform:scale(.94);filter:brightness(1.3)}.dir{background:#263d5d;font-size:22px}#leftBtn::after{content:" LEFT";font-size:9px}#rightBtn::after{content:" RIGHT";font-size:9px}.punchBtn{background:#d7243f}.kickBtn{background:#dd6135}.dashBtn{background:#7a39ca}.powerBtn{background:#e59612}.blockBtn{background:#2473bc}.jumpBtn{background:#159a6f}@media (orientation:portrait){#hud{grid-template-columns:1fr 1fr}#round{position:absolute;left:50%;top:67px;transform:translateX(-50%)}#status{top:42px}.fighter{transform:scale(.88);transform-origin:bottom center}#red{left:10%}#blue{left:65%}#controls{grid-template-columns:112px 1fr}.btn{min-height:49px}}@media(max-width:420px){#controls{grid-template-columns:100px 1fr;gap:6px;padding-top:6px}#movePad,#actions{gap:5px}.btn{min-height:46px;font-size:9px}.fighter{transform:scale(.82);transform-origin:bottom center}}
</style></head><body><div id="app"><div id="hud"><div class="card"><div class="name">🔴 YOU · RED</div><div class="bar"><div class="fill" id="redHP"></div></div><div class="bar meter"><div class="fill" id="redEN"></div></div></div><div id="round">ROUND 1</div><div class="card ai"><div class="name">🔵 CHATGPT AI · BLUE</div><div class="bar"><div class="fill" id="blueHP"></div></div><div class="bar meter"><div class="fill" id="blueEN"></div></div></div></div><div id="world"><div id="mountains"></div><div id="arena"></div><div id="status">Fight! Hold LEFT or RIGHT. Tap PUNCH to attack.</div><div class="fighter red" id="red"><div class="badge">YOU</div><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="eye a"></div><div class="eye b"></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div></div><div class="fighter blue" id="blue"><div class="badge">CHATGPT AI</div><div class="shadow"></div><div class="hair"></div><div class="head"></div><div class="eye a"></div><div class="eye b"></div><div class="body"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div></div><div id="orb"></div><div id="overlay"><div id="result"></div><div id="sub"></div><button id="again" type="button">FIGHT AGAIN</button></div></div><div id="controls"><div id="movePad"><button id="leftBtn" class="btn dir" type="button">◀</button><button id="rightBtn" class="btn dir" type="button">▶</button></div><div id="actions"><button id="punchBtn" class="btn punchBtn" type="button">👊 PUNCH</button><button id="kickBtn" class="btn kickBtn" type="button">🦵 KICK</button><button id="dashBtn" class="btn dashBtn" type="button">💨 DASH</button><button id="powerBtn" class="btn powerBtn" type="button">⚡ POWER</button><button id="blockBtn" class="btn blockBtn" type="button">🛡 BLOCK</button><button id="jumpBtn" class="btn jumpBtn" type="button">⬆ JUMP</button></div></div></div>
<script>
(() => {'use strict';const $=id=>document.getElementById(id);const el={red:$('red'),blue:$('blue'),redHP:$('redHP'),blueHP:$('blueHP'),redEN:$('redEN'),blueEN:$('blueEN'),status:$('status'),round:$('round'),orb:$('orb'),overlay:$('overlay'),result:$('result'),sub:$('sub'),again:$('again'),left:$('leftBtn'),right:$('rightBtn'),punch:$('punchBtn'),kick:$('kickBtn'),dash:$('dashBtn'),power:$('powerBtn'),block:$('blockBtn'),jump:$('jumpBtn')};const game={round:1,over:false,redHP:100,blueHP:100,redEN:100,blueEN:100,redX:15,blueX:70,move:0,redBusy:false,blueBusy:false,redBlock:false,blueBlock:false,last:performance.now()};function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function say(t){el.status.textContent=t}function updateUI(){el.redHP.style.width=game.redHP+'%';el.blueHP.style.width=game.blueHP+'%';el.redEN.style.width=game.redEN+'%';el.blueEN.style.width=game.blueEN+'%';el.red.style.left=game.redX+'%';el.blue.style.left=game.blueX+'%'}function dist(){return Math.abs(game.blueX-game.redX)}function flash(n){n.classList.add('hurt');setTimeout(()=>n.classList.remove('hurt'),120)}function anim(n,c,ms){n.classList.remove(c);void n.offsetWidth;n.classList.add(c);setTimeout(()=>n.classList.remove(c),ms)}function damageBlue(n){if(game.over)return;if(game.blueBlock)n=Math.ceil(n*.3);game.blueHP=clamp(game.blueHP-n,0,100);flash(el.blue);updateUI();if(game.blueHP<=0)endFight(true)}function damageRed(n){if(game.over)return;if(game.redBlock)n=Math.ceil(n*.3);game.redHP=clamp(game.redHP-n,0,100);flash(el.red);updateUI();if(game.redHP<=0)endFight(false)}function endFight(redWon){game.over=true;game.move=0;(redWon?el.blue:el.red).classList.add('ko');el.result.textContent=redWon?'RED WINS!':'BLUE WINS!';el.sub.textContent=redWon?'You beat ChatGPT AI!':'ChatGPT AI wins this round.';el.overlay.classList.add('show')}function melee(name,cls,damage,range,ms,delay){if(game.over||game.redBusy)return;game.redBusy=true;anim(el.red,cls,ms);say('RED '+name+'!');setTimeout(()=>{if(dist()<=range)damageBlue(damage);else say('Too far away. Hold RIGHT to get closer.')},delay);setTimeout(()=>game.redBusy=false,ms+40)}function punch(){melee('PUNCH','punch',9,27,260,120)}function kick(){melee('KICK','kick',14,30,350,160)}function dash(){if(game.over||game.redBusy||game.redEN<18)return;game.redBusy=true;game.redEN-=18;anim(el.red,'dash',310);say('RED DASH ATTACK!');game.redX=Math.min(game.blueX-10,game.redX+14);updateUI();setTimeout(()=>damageBlue(16),135);setTimeout(()=>game.redBusy=false,340)}function power(){if(game.over||game.redBusy||game.redEN<25)return;game.redBusy=true;game.redEN-=25;updateUI();say('RED POWER BLAST!');const world=$('world').getBoundingClientRect(),rr=el.red.getBoundingClientRect(),br=el.blue.getBoundingClientRect();el.orb.style.display='block';el.orb.style.transition='none';el.orb.style.left=(rr.left-world.left+rr.width*.65)+'px';el.orb.style.top=(rr.top-world.top+75)+'px';requestAnimationFrame(()=>{el.orb.style.transition='left .34s linear,top .34s linear';el.orb.style.left=(br.left-world.left+18)+'px';el.orb.style.top=(br.top-world.top+76)+'px'});setTimeout(()=>{el.orb.style.display='none';damageBlue(20);game.redBusy=false},360)}function block(){if(game.over)return;game.redBlock=true;el.red.classList.add('block');say('RED BLOCK!');setTimeout(()=>{game.redBlock=false;el.red.classList.remove('block')},750)}function jump(){if(game.over||game.redBusy)return;game.redBusy=true;anim(el.red,'jump',500);say('RED JUMP!');setTimeout(()=>game.redBusy=false,520)}function aiTurn(){if(game.over||game.blueBusy)return;game.blueBusy=true;const d=dist(),r=Math.random();if(r<.16){game.blueBlock=true;el.blue.classList.add('block');say('BLUE BLOCKS!');setTimeout(()=>{game.blueBlock=false;el.blue.classList.remove('block');game.blueBusy=false},600);return}if(d>28){game.blueX=Math.max(game.redX+12,game.blueX-6);updateUI();say('BLUE moves closer.');setTimeout(()=>game.blueBusy=false,330);return}if(r<.58){anim(el.blue,'punch',260);say('BLUE PUNCHES!');setTimeout(()=>damageRed(7),120);setTimeout(()=>game.blueBusy=false,300)}else if(r<.86){anim(el.blue,'kick',350);say('BLUE KICKS!');setTimeout(()=>damageRed(11),165);setTimeout(()=>game.blueBusy=false,390)}else{anim(el.blue,'dash',310);game.blueX=Math.max(game.redX+11,game.blueX-10);updateUI();say('BLUE DASH ATTACK!');setTimeout(()=>damageRed(14),140);setTimeout(()=>game.blueBusy=false,350)}}function setMove(dir,active){game.move=active?dir:0;const b=dir<0?el.left:el.right;b.classList.toggle('active',active)}function bindHold(button,dir){const on=e=>{e.preventDefault();setMove(dir,true)},off=e=>{e.preventDefault();if(game.move===dir)setMove(dir,false)};button.addEventListener('pointerdown',on,{passive:false});button.addEventListener('pointerup',off,{passive:false});button.addEventListener('pointercancel',off,{passive:false});button.addEventListener('pointerleave',off,{passive:false});button.addEventListener('touchstart',on,{passive:false});button.addEventListener('touchend',off,{passive:false});button.addEventListener('touchcancel',off,{passive:false});button.addEventListener('mousedown',on,{passive:false});window.addEventListener('mouseup',off,{passive:false})}function bindTap(button,fn){let last=0;const fire=e=>{e.preventDefault();const now=performance.now();if(now-last<180)return;last=now;fn()};button.addEventListener('pointerdown',fire,{passive:false});button.addEventListener('touchstart',fire,{passive:false});button.addEventListener('mousedown',fire,{passive:false});button.addEventListener('click',fire,{passive:false})}bindHold(el.left,-1);bindHold(el.right,1);bindTap(el.punch,punch);bindTap(el.kick,kick);bindTap(el.dash,dash);bindTap(el.power,power);bindTap(el.block,block);bindTap(el.jump,jump);function reset(){game.over=false;game.redHP=100;game.blueHP=100;game.redEN=100;game.blueEN=100;game.redX=15;game.blueX=70;game.move=0;game.redBusy=false;game.blueBusy=false;game.redBlock=false;game.blueBlock=false;game.round++;el.round.textContent='ROUND '+game.round;el.red.className='fighter red';el.blue.className='fighter blue';el.overlay.classList.remove('show');say('Fight! Hold RIGHT to move toward BLUE.');updateUI()}bindTap(el.again,reset);addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')game.move=-1;if(e.code==='ArrowRight'||e.code==='KeyD')game.move=1;if(e.code==='KeyJ')punch();if(e.code==='KeyK')kick();if(e.code==='KeyL')dash();if(e.code==='KeyI')power();if(e.code==='ShiftLeft'||e.code==='ShiftRight')block();if(e.code==='Space')jump()});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA','ArrowRight','KeyD'].includes(e.code))game.move=0});setInterval(aiTurn,930);function loop(now){const dt=Math.min(.04,(now-game.last)/1000);game.last=now;if(!game.over&&game.move){game.redX=clamp(game.redX+game.move*28*dt,2,game.blueX-9);updateUI()}if(!game.over){game.redEN=clamp(game.redEN+9*dt,0,100);game.blueEN=clamp(game.blueEN+8*dt,0,100);updateUI()}requestAnimationFrame(loop)}updateUI();requestAnimationFrame(loop)})();
</script></body></html>
